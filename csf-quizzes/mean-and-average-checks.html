<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mean and Average Checks</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="wrap">
<h1>Mean and Average Checks</h1>
<div class="card" id="quizCard">
<form id="quizForm"></form>
<div class="btn-row"><button class="btn-primary" id="submitBtn">Submit</button></div>
</div>
<div class="card timer-panel" id="timerPanel" hidden>
<p>Calculating your results in</p>
<p class="timer-count" id="countdown">2:00</p>
</div>
<div class="card" id="resultsPanel" hidden>
<p class="score-line" id="scoreLine"></p>
<div class="btn-row">
<button class="btn-primary" id="tryAgainBtn">Try again</button>
<button class="btn-quiet" id="clearHistoryBtn">Clear history</button>
</div>
<div id="historyWrap" style="margin-top:16px;"></div>
</div>
</div>
<script>
var QUIZ_META = {"slug":"csf-quizzes-mean-and-average-checks","quizName":"Mean and Average Checks","subject":"","notes":"","scrambleOrder":false,"liveBackend":"none","sheetsUrl":"","firebaseUrl":""};
var QUIZ_DATA = [{"scramble":false,"question":"What is the mean number of checks for {4, 7, 10, 9}?","answer":"7.5","choices":["7.5","10","15","25.5"]},{"scramble":false,"question":"What is the mean number of checks for {2, 6, 8, 12}?","answer":"7","choices":["7","9.33","14","20"]},{"scramble":false,"question":"What is the mean number of checks for {5, 11, 3, 9}?","answer":"7","choices":["7","9.33","14","23.5"]},{"scramble":false,"question":"What is the mean number of checks for {1, 4, 9, 14}?","answer":"7","choices":["7","9.33","14","21"]},{"scramble":false,"question":"What is the mean number of checks for {3, 9, 12}?","answer":"8","choices":["8","12","12","19.5"]},{"scramble":false,"question":"What is the mean number of checks for {2, 8, 10, 14, 16}?","answer":"10","choices":["10","12.5","25","42"]},{"scramble":false,"question":"What is the mean number of checks for {1, 3, 5, 7, 9, 11, 13}?","answer":"7","choices":["7","8.17","24.5","42.5"]},{"scramble":false,"question":"What is the average number of checks for 100 items?","answer":"50","choices":["50","100","1","200"]},{"scramble":false,"question":"What is the average number of checks for 1200 items?","answer":"600","choices":["600","1200","1","2400"]},{"scramble":false,"question":"What is the average number of checks for 5 items?","answer":"2.5","choices":["2.5","5","1","10"]},{"scramble":false,"question":"What is the average number of checks for 10^6 items?","answer":"500,000","choices":["500,000","1,000,000","1","2,000,000"]},{"scramble":false,"question":"What is the average number of checks for 2^8 items?","answer":"2^7","choices":["2^7","1^7","2^9","2^8"]}];
var state = { order: [], submitted: false };
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildOrder(){var idx=QUIZ_DATA.map(function(q,i){return i;});return QUIZ_META.scrambleOrder?shuffle(idx):idx;}
function render(){state.order=buildOrder();var form=document.getElementById("quizForm");form.innerHTML="";state.order.forEach(function(qi,n){var q=QUIZ_DATA[qi];var block=document.createElement("div");block.className="question";block.dataset.qi=qi;var qt=document.createElement("p");qt.className="qtext";qt.textContent=(n+1)+". "+q.question;block.appendChild(qt);if(q.choices&&q.choices.length){var list=document.createElement("div");list.className="choice-list";var choices=q.scramble?shuffle(q.choices):q.choices.slice();choices.forEach(function(c){var label=document.createElement("label");label.className="choice";var input=document.createElement("input");input.type="radio";input.name="q"+qi;input.value=c;label.appendChild(input);var span=document.createElement("span");span.textContent=c;label.appendChild(span);list.appendChild(label);});block.appendChild(list);}else{var inp=document.createElement("input");inp.type="text";inp.className="text-input";inp.name="q"+qi;inp.placeholder="Type your answer";block.appendChild(inp);}form.appendChild(block);});}
function grade(){var correct=0;state.order.forEach(function(qi){var q=QUIZ_DATA[qi];var block=document.querySelector('.question[data-qi="'+qi+'"]');var isRight=false;if(q.choices&&q.choices.length){var checked=block.querySelector('input[type="radio"]:checked');var val=checked?checked.value:"";isRight=val.trim().toLowerCase()===q.answer.trim().toLowerCase();block.querySelectorAll(".choice").forEach(function(lbl){var inp=lbl.querySelector("input");inp.disabled=true;if(inp.value.trim().toLowerCase()===q.answer.trim().toLowerCase()){lbl.classList.add("correct");}else if(inp.checked){lbl.classList.add("wrong");}});}else{var field=block.querySelector(".text-input");var v=field.value||"";isRight=v.trim().toLowerCase()===q.answer.trim().toLowerCase();field.disabled=true;field.classList.add(isRight?"correct":"wrong");var note=document.createElement("p");note.className="answer-note";note.textContent="Correct answer: "+q.answer;field.insertAdjacentElement("afterend",note);}if(isRight)correct++;});return{correct:correct,total:state.order.length};}
function fmtTime(s){var m=Math.floor(s/60);var sec=s%60;return m+":"+(sec<10?"0":"")+sec;}
function startTimerThenReveal(result){var timerPanel=document.getElementById("timerPanel");timerPanel.hidden=false;var seconds=window.__QUIZ_DEBUG_SECONDS__||120;var countEl=document.getElementById("countdown");countEl.textContent=fmtTime(seconds);var iv=setInterval(function(){seconds--;countEl.textContent=fmtTime(seconds);if(seconds<=0){clearInterval(iv);timerPanel.hidden=true;reveal(result);}},1000);}
function historyKey(){return "quizHistory_"+QUIZ_META.slug;}
function loadHistory(){try{return JSON.parse(localStorage.getItem(historyKey())||"[]");}catch(e){return [];}}
function saveAttempt(result){var hist=loadHistory();hist.push({date:new Date().toLocaleString(),score:result.correct,total:result.total});localStorage.setItem(historyKey(),JSON.stringify(hist));return hist;}
function renderHistory(hist){var wrap=document.getElementById("historyWrap");if(!hist.length){wrap.innerHTML='<p class="answer-note">No previous attempts yet.</p>';return;}var rows=hist.slice().reverse().map(function(h){return "<tr><td>"+h.date+"</td><td>"+h.score+" / "+h.total+"</td></tr>";}).join("");wrap.innerHTML='<table class="history"><thead><tr><th>When</th><th>Score</th></tr></thead><tbody>'+rows+"</tbody></table>";}
function sendLiveResult(result){if(QUIZ_META.liveBackend==="none")return;var classEl=document.getElementById("liveClassCode");var studentEl=document.getElementById("liveStudentCode");if(!classEl||!studentEl)return;var classCode=classEl.value.trim();var studentCode=studentEl.value.trim();if(!classCode||!studentCode)return;localStorage.setItem("liveClassCode",classCode);localStorage.setItem("liveStudentCode",studentCode);var payload={classCode:classCode,studentCode:studentCode,quizName:QUIZ_META.quizName,quizSlug:QUIZ_META.slug,score:result.correct,total:result.total,percent:Math.round((result.correct/result.total)*100),timestamp:new Date().toISOString()};try{if(QUIZ_META.liveBackend==="sheets"&&QUIZ_META.sheetsUrl){fetch(QUIZ_META.sheetsUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});}else if(QUIZ_META.liveBackend==="firebase"&&QUIZ_META.firebaseUrl){var key=studentCode.replace(/[.#$\[\]\/]/g,"_")+"_"+Date.now();fetch(QUIZ_META.firebaseUrl.replace(/\/$/,"")+"/results/"+encodeURIComponent(classCode)+"/"+key+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}}catch(e){}}
function reveal(result){var hist=saveAttempt(result);sendLiveResult(result);var panel=document.getElementById("resultsPanel");panel.hidden=false;var pct=Math.round((result.correct/result.total)*100);var line=document.getElementById("scoreLine");line.textContent="Score: "+result.correct+" / "+result.total+" ("+pct+"%)";line.className="score-line "+(pct>=70?"pass":"fail");renderHistory(hist);}
document.getElementById("submitBtn").addEventListener("click",function(e){e.preventDefault();if(state.submitted)return;state.submitted=true;document.getElementById("submitBtn").disabled=true;var result=grade();startTimerThenReveal(result);});
document.getElementById("tryAgainBtn").addEventListener("click",function(){state.submitted=false;document.getElementById("submitBtn").disabled=false;document.getElementById("resultsPanel").hidden=true;render();});
document.getElementById("clearHistoryBtn").addEventListener("click",function(){if(confirm("Clear all saved history for this quiz? This cannot be undone.")){localStorage.removeItem(historyKey());renderHistory([]);}});
var liveClassEl=document.getElementById("liveClassCode"),liveStudentEl=document.getElementById("liveStudentCode");if(liveClassEl){liveClassEl.value=localStorage.getItem("liveClassCode")||"";liveClassEl.addEventListener("input",function(){localStorage.setItem("liveClassCode",liveClassEl.value.trim());});}if(liveStudentEl){liveStudentEl.value=localStorage.getItem("liveStudentCode")||"";liveStudentEl.addEventListener("input",function(){localStorage.setItem("liveStudentCode",liveStudentEl.value.trim());});}
render();renderHistory(loadHistory());
</script>
</body>
</html>
